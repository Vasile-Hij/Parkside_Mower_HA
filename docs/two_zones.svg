<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Garden -->
  <rect x="20" y="20" width="860" height="390" rx="14" fill="#eef7e8" stroke="#9cc58a" stroke-width="2"/>
  <text x="36" y="46" font-size="16" font-weight="bold" fill="#3c6e2f">Garden</text>

  <!-- House -->
  <rect x="370" y="20" width="160" height="70" fill="#e6e1d8" stroke="#8a8170" stroke-width="2"/>
  <text x="450" y="60" text-anchor="middle" fill="#5b5446">House</text>

  <!-- Zone areas -->
  <rect x="60" y="120" width="270" height="255" fill="#d9ecff" fill-opacity="0.55"/>
  <rect x="570" y="120" width="270" height="255" fill="#ffe6cc" fill-opacity="0.55"/>

  <!-- Zone 1 loop: + from relay NO, - back to dock -->
  <path d="M 420 275 L 420 300 L 330 300 L 330 120 L 60 120 L 60 375 L 405 375" fill="none" stroke="#1f6fd1" stroke-width="3"/>
  <text x="195" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f6fd1">ZONE 1</text>
  <text x="195" y="254" text-anchor="middle" fill="#1f6fd1">relay ON (NO contact)</text>

  <!-- Zone 2 loop: + from relay NC, - back to dock -->
  <path d="M 480 275 L 480 300 L 570 300 L 570 120 L 840 120 L 840 375 L 495 375" fill="none" stroke="#d1701f" stroke-width="3"/>
  <text x="705" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#d1701f">ZONE 2</text>
  <text x="705" y="254" text-anchor="middle" fill="#d1701f">relay OFF (NC contact, default)</text>

  <!-- Relay box -->
  <rect x="395" y="180" width="110" height="95" rx="8" fill="#ffffff" stroke="#444" stroke-width="2"/>
  <text x="450" y="200" text-anchor="middle" font-weight="bold">Mower Zone</text>
  <text x="450" y="217" text-anchor="middle" font-size="12">ESP-01 + relay</text>
  <text x="450" y="232" text-anchor="middle" font-size="12">+ BME280</text>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#1f6fd1">NO</text>
  <text x="450" y="266" text-anchor="middle" font-size="12">COM</text>
  <text x="480" y="266" text-anchor="middle" font-size="12" fill="#d1701f">NC</text>
  <text x="406" y="294" font-size="13" font-weight="bold" fill="#1f6fd1">+</text>
  <text x="485" y="294" font-size="13" font-weight="bold" fill="#d1701f">+</text>

  <!-- Dock + to relay COM -->
  <line x1="450" y1="355" x2="450" y2="275" stroke="#c62828" stroke-width="3"/>
  <text x="457" y="330" font-size="12" font-weight="bold" fill="#c62828">+</text>

  <!-- Dock -->
  <rect x="405" y="355" width="90" height="40" rx="6" fill="#555"/>
  <text x="450" y="380" text-anchor="middle" fill="#fff" font-weight="bold">Dock</text>
  <text x="390" y="369" font-size="13" font-weight="bold" fill="#1f6fd1">−</text>
  <text x="500" y="369" font-size="13" font-weight="bold" fill="#d1701f">−</text>
  <text x="450" y="404" text-anchor="middle" font-size="11" fill="#444">both − joined at dock −</text>

  <!-- Mower -->
  <circle cx="110" cy="295" r="16" fill="#2f7d32"/>
  <text x="110" y="300" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">M</text>
  <text x="132" y="291" font-size="12" fill="#2f7d32">PAMR 500 A1</text>
  <text x="132" y="306" font-size="12" fill="#2f7d32">+ ESP8266 (Robot_mower)</text>

  <!-- Legend / logic -->
  <text x="36" y="436" font-size="16" font-weight="bold">How it works</text>
  <text x="36" y="460">1. Mower setup: 1 zone, schedule 00:00 - 23:59 every day, stop on rain + resume. The mower always "wants" to mow.</text>
  <text x="36" y="481">2. Dock + goes to relay COM; NO = Zone 1 +, NC = Zone 2 +. Both loop − ends are joined directly at dock −.</text>
  <text x="36" y="502">3. ESP in the mower fakes rain on the rain sensor wire: Mow OFF = rain (stay docked), Mow ON = dry (go mow).</text>
  <text x="36" y="523">4. HA decides when (Mow switch + Mowing time) and where (Mower zone select). Timekeeping runs on the mower ESP.</text>
  <text x="36" y="546" fill="#777" font-size="12">Sketch only, not to scale. Change zone only while the mower is docked.</text>
</svg>
